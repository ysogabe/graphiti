# Graphiti MCP server deployment config (this box, .39)
# LLM = b.ai glm-5.3-flash (campaign), embedding = Google Vertex AI text-embedding-005,
# DB = Neo4j (container "neo4j"). Secrets via env. Server default group = shared ledger (minamo).
server:
  transport: http
  host: 0.0.0.0
  port: 8100

llm:
  provider: openai
  model: ${MODEL_NAME:glm-5.3-flash}
  max_tokens: ${LLM_MAX_TOKENS:32768}
  reasoning_effort: ${LLM_REASONING_EFFORT:high}   # glm rejects medium/off (400)
  structured_output_mode: ${LLM_STRUCTURED_OUTPUT_MODE:json_object}
  providers:
    openai:
      api_key: ${BAI_API_KEY}
      api_url: ${BAI_API_URL:https://api.b.ai/v1}
      organization_id: ${OPENAI_ORGANIZATION_ID:}

embedder:
  provider: gemini
  # gemini-embedding-001, NOT text-embedding-005: measured over this Vertex API-key route,
  # text-embedding-005 (and -004) do not encode CJK at all — every input whose characters the
  # tokenizer does not cover collapses onto one constant vector per chunk-count ('みなも',
  # 'トヨタ', 'ミナモ' and '한국어' all return the same 768d vector; two space-separated CJK
  # chunks return a second constant). gemini-embedding-001 encodes them properly
  # (5/5 related-vs-unrelated separation on Japanese pairs, vs 1/5 for 005).
  model: ${EMBEDDER_MODEL:gemini-embedding-001}
  dimensions: ${EMBEDDER_DIMENSIONS:768}
  providers:
    gemini:
      api_key: ${GOOGLE_API_KEY}
      project_id: ${GOOGLE_CLOUD_PROJECT:257425471273}
      location: ${GOOGLE_CLOUD_LOCATION:global}
      vertexai: ${EMBEDDER_VERTEXAI:true}

reranker:
  # The provider probe would take the LLM provider first, i.e. OpenAIRerankerClient against
  # b.ai — that one relies on OpenAI's logprobs/logit_bias and is rejected there (measured:
  # HTTP 400 "max_tokens must be greater than 2"). The Gemini client scores each passage 0-100
  # instead and runs over the same Vertex route as the embedder (measured: 0.0 for unrelated
  # queries, 0.5-0.85 for relevant ones, +0.8s per search).
  provider: ${RERANKER_PROVIDER:gemini}
  model: ${RERANKER_MODEL:gemini-2.5-flash-lite}
  min_score: ${RERANKER_MIN_SCORE:0.5}

database:
  provider: neo4j
  providers:
    neo4j:
      uri: ${NEO4J_URI:bolt://localhost:7687}
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD:testpass}

graphiti:
  # Server-default group. The memory-provider plugin passes an explicit group_id per
  # request (haruo / minamo), so this only matters for direct clients (Claude Code, Codex)
  # that omit group_id — they land in the shared ledger (minamo) by default.
  group_id: ${GRAPHITI_GROUP_ID:minamo}
  episode_id_prefix: ${EPISODE_ID_PREFIX:}
  user_id: ${USER_ID:mcp_user}
